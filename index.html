<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo Tide / 叠影潮</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e7fff8;
        --muted: #9fb8b4;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(900px 420px at 50% -10%, #13464c 0%, transparent 60%),
          #070d12;
        color: var(--ink);
        font-family: "WenQuanYi Micro Hei", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 28px 16px 40px;
      }
      .wrap { width: min(960px, 100%); }
      .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
      select, button { font: inherit; color: var(--ink); background: #173e44; border: 1px solid #477b78; border-radius: 6px; padding: 9px 12px; }
      button { cursor: pointer; }
      [hidden] { display: none !important; }
      h1 {
        font-size: 1.35rem;
        font-weight: 640;
        letter-spacing: 0.04em;
        margin: 0 0 6px;
      }
      h1 span { color: #8ef6df; font-weight: 520; }
      .lede {
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }
      canvas {
        width: 100%;
        height: auto;
        display: block;
        background: #071018;
        border-radius: 12px;
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.35), 0 0 0 1px #24555a;
      }
      canvas:focus { outline: 2px solid #8ef6df; outline-offset: 3px; }
      .foot {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Echo Tide <span>/ 叠影潮</span></h1>
      <p class="lede">虚线提前预告桥位，起跳后直接成桥。首次踩上回声后，才会揭示本局左右两岸的潮印位置。</p>
      <div class="toolbar"><label for="room">关卡</label><select id="room"><option value="0">01 折返接力</option><option value="1">02 留一条退路</option><option value="2">03 借路归航</option></select><label for="difficulty">操作</label><select id="difficulty"><option value="hard" selected>挑战：空中二选一</option><option value="standard">入门：确定平台</option></select><button id="restart" type="button">重试本关</button><button id="next" type="button" hidden>下一关 →</button></div>
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="叠影潮游戏。方向键或 AD 移动，空格跳跃，E 锚定，R 重开。"></canvas>
      <p id="status" class="foot" role="status" aria-live="polite"></p>
      <p id="hint" class="foot"></p>
      <p class="foot">挑战模式：第一跳安全教学；踩上首块回声后，每跳始终显示两个候选落点：黄虚框表示可能出现的窄回声，绿实框表示已有石台。约 0.16 秒后突出实际落点，另一候选变淡，但两框直到落脚都不消失。观察具体落点，空中用方向键修正；没有升起闪动动画。入门模式仍提供固定的宽桥。第一次踩上回声后揭晓本局左右岸潮印，必须取得后才能出关。使用 ←→ / A D 移动，空格 / W / ↑ 跳跃，E 锚定，R 重开，Enter 下一关。最多锚定一块；切换标签页自动暂停。</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
