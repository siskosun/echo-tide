name: Mobile portrait regression
on:
  push:
    branches:
      - feat/mobile-landscape-only-20261021
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/mobile-portrait-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node test/mobile-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-capture
          path: mobile-landscape-smoke.png
          if-no-files-found: ignore
