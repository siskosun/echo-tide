name: Mobile portrait regression
on:
  push:
    branches:
      - feat/mobile-landscape-only-20261021
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/mobile-portrait-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: ET_SMOKE_BUILT=1 node test/mobile-browser-smoke.mjs
      - name: Package unlisted local phone trial
        run: |
          mkdir -p phone-trial
          cp -R dist phone-trial/dist
          cp .github/MOBILE_TRIAL.md phone-trial/README.md
          printf 'source_head=%s\ncheckout_commit=%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" "$(git rev-parse HEAD)" > phone-trial/BUILD_ID.txt
          (cd phone-trial && zip -q -r ../echo-tide-phone-trial.zip .)
          sha256sum echo-tide-phone-trial.zip > echo-tide-phone-trial.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: echo-tide-phone-trial
          path: |
            echo-tide-phone-trial.zip
            echo-tide-phone-trial.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-browser-capture
          path: mobile-landscape-smoke.png
          if-no-files-found: ignore
