name: Mobile portrait regression
on:
  push:
    branches:
      - feat/mobile-landscape-only-20261021
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'index.html'
      - 'package*.json'
      - '.github/workflows/mobile-portrait-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
